    <script>
      (function () {
        // In AI Studio preview iframes, HMR WebSockets are not used or may be closed by reverse proxies.
        // Catch benign Vite client WebSocket rejections so they don't generate unhandled console warnings.
        window.addEventListener('unhandledrejection', function (event) {
          var msg = (event && event.reason && (event.reason.message || event.reason.toString())) || '';
          if (typeof msg === 'string' && msg.indexOf('WebSocket closed without opened') !== -1) {
            event.preventDefault();
          }
        });

        var d = document.documentElement;
        d.classList.add('js');
      })();
    </script>
