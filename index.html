    <script>
      (function () {
        // In AI Studio preview iframes, HMR WebSockets are not used or may be closed by reverse proxies.
        // Catch benign Vite client WebSocket rejections so they don't generate unhandled console warnings.
        window.addEventListener('unhandledrejection', function (event) {
          var msg = (event && event.reason && (event.reason.message || event.reason.toString())) || '';
          if (typeof msg === 'string' && msg.indexOf('WebSocket closed without opened') !== -1) {
            event.preventDefault();
          }
        });

        var d = document.documentElement;
        d.classList.add('js');
        try {
          var skip = sessionStorage.getItem('coverSeen') || sessionStorage.getItem('coverDismissed') || location.hash;
          if (skip) { d.classList.add('skip-cover'); return; }
        } catch (e) {}
        var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reduce) d.classList.add('cover-anim');
      })();
    </script>
